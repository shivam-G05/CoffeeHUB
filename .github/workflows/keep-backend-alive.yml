name: Keep backend alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://api.ojass.co/api/products)
          echo "Backend responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "::warning::Backend did not return 200 (got $status)"
          fi
