server:
  port: ${PORT:8080}

spring:
  application:
    name: coffeehub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coffeehub}
    username: ${SPRING_DATASOURCE_USERNAME:coffeehub}
    password: ${SPRING_DATASOURCE_PASSWORD:coffeehub}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Email: set SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
# to send real mail. Without them, emails (reset links, notifications) are written to the log.

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  # Base URL used in links inside emails/notifications.
  frontend-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@coffeehub.local}
  payments:
    # Simulated "pay online" button for development/demo. Keep false in production
    # until a real payment gateway is integrated.
    mock-enabled: ${PAYMENTS_MOCK_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    admin-email: ${ADMIN_SEED_EMAIL:admin@coffeehub.in}
    admin-password: ${ADMIN_SEED_PASSWORD:Admin@12345}
    enabled: ${SEED_ADMIN:true}

logging:
  level:
    com.coffeehub: ${LOG_LEVEL:INFO}
